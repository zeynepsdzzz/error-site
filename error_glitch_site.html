<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistem Hatası</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}
body{background:#090b0d;color:#eee;font-family:Arial,sans-serif}
#screen{position:fixed;inset:0;background:radial-gradient(circle,#222a30,#08090a 70%)}
.glitch{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:999;background:
repeating-linear-gradient(0deg,transparent 0 7px,rgba(255,255,255,.12) 8px 9px,transparent 10px 15px),
linear-gradient(90deg,transparent 0 20%,rgba(255,0,80,.16) 21% 22%,transparent 23% 65%,rgba(0,220,255,.14) 66% 67%,transparent 68%)}
.glitch.on{opacity:1;animation:flicker .13s steps(2) infinite}
@keyframes flicker{50%{transform:translate(4px,-2px);filter:contrast(1.6)}}
.win{position:absolute;width:min(370px,84vw);background:#e9e9e9;color:#222;border:1px solid #777;border-radius:8px;box-shadow:0 16px 45px #000b;overflow:hidden;animation:pop .15s ease-out;transform-origin:center}
@keyframes pop{from{transform:scale(.75);opacity:.2}to{transform:scale(1);opacity:1}}
.bar{height:40px;padding:0 10px;display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#d86780,#b94e66);color:#fff;font-size:14px;font-weight:600}
.close{border:0;background:transparent;color:#fff;font-size:25px;cursor:pointer}
.body{display:flex;gap:13px;align-items:center;padding:20px 18px 13px;font-size:15px;min-height:100px}
.icon{width:36px;height:36px;border-radius:50%;background:#d5d5d5;border:1px solid #aaa;display:grid;place-items:center;color:#d24f55;font-weight:bold;font-size:24px;flex:none}
.actions{text-align:center;padding:0 18px 15px}.ok{min-width:95px;padding:7px 20px;border:1px solid #888;background:linear-gradient(#fff,#d8d8d8);border-radius:3px}
.big{font-size:19px}.huge{font-size:24px}.max{font-size:30px}
</style>
</head>
<body>
<div id="screen"></div><div id="glitch" class="glitch"></div>
<script>
const stages=[
 ["Sistem hatası;((","¿hangi kadın doldurur yerini¿"],
 ["Sistem hatası;((","söyle?!?! bu benim handikapım, ya-ah, bu yüzden dolu kapım'>'1?"],
 ["Sistem hatası;((","sırtım dolu 😅 b!!ç@@k y****ları ¿;/"],
 ["SISTEM.HATASI.;(.",";((sırtım.DOLU b!!ç@k y****ları #!?;;(("],
 [". SISTEM. HATA. SI;;(((( ","bana yardım et tanrım://"]
];
let stage=0, z=10, win;
const glitch=document.getElementById("glitch");

function make(stageIndex, scale=1){
 stage=stageIndex;
 const old=win;
 if(old) old.remove();
 const w=document.createElement("div"); win=w; w.className="win";
 w.style.zIndex=++z;
 w.style.transform=`scale(${scale})`;
 const ww=Math.min(370,innerWidth*.84);
 w.style.left=Math.max(8,(innerWidth-ww)/2 + (stageIndex>=3?(Math.random()*40-20):0))+"px";
 w.style.top=Math.max(45,(innerHeight-185)/2 + (stageIndex>=3?(Math.random()*50-25):0))+"px";
 if(stageIndex>=3) glitch.classList.add("on"); else glitch.classList.remove("on");
 const cls=stageIndex===4?"max":stageIndex===3?"huge":stageIndex===2?"big":"";
 w.innerHTML=`<div class="bar"><span>${stages[stageIndex][0]}</span><button class="close">×</button></div>
 <div class="body ${cls}"><div class="icon">×</div><div>${stages[stageIndex][1]}</div></div>
 <div class="actions"><button class="ok">Tamam</button></div>`;
 w.querySelector(".close").onclick=()=>{
   const nextScale=stageIndex>=3 ? Math.min(scale+.18,2.5) : 1;
   if(stageIndex<4) make(stageIndex+1,1);
   else make(4,nextScale);
 };
 w.querySelector(".ok").onclick=()=>{
   if(stageIndex===0){w.remove();glitch.classList.remove("on");win=null;return}
   make(stageIndex-1,1);
 };
 document.getElementById("screen").appendChild(w);
}
make(0);
</script>
</body>
</html>
